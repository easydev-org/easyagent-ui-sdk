name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # FORMAT AND LINT, BEFORE THE BUILD. `npm run build` succeeds on misformatted code, so without
      # this step a formatting problem has no signal at all: it surfaces as churn in a later diff.
      #
      # IT FAILS RATHER THAN FIXING. A CI job that rewrites files and passes leaves the diff on a
      # runner nobody reads; the author has to run `npm run format:fix` and see it in their own diff.
      - name: format
        run: npm run format:check

      # TYPES FIRST, INCLUDING THE TESTS. A test that does not compile is a test that has stopped
      # telling you anything, and it fails in a way that looks like "the test is broken" rather than
      # "the types are broken".
      - run: npm run check

      - run: npm test

      - run: npm run build

      # THE PACKAGE MUST CONTAIN THE BUILT FILES AND NOT THE TESTS. `npm pack --dry-run` prints the
      # exact manifest a consumer would download, which is the only place that fact is visible before
      # publishing.
      - name: what would be published
        run: npm pack --dry-run

      - name: the build produced what package.json promises
        run: |
          set -euo pipefail
          # BOTH ENTRIES, because package.json exports them and a missing host.js would only fail in
          # the console's build — a repository this one's CI never touches.
          for f in dist/index.js dist/index.d.ts dist/host.js dist/host.d.ts \
                   dist/protocol.js dist/theme.js dist/card.js; do
            test -f "$f" || { echo "::error::$f is missing from the build"; exit 1; }
          done
          # THE STYLESHEETS ARE NOT BUILT — they are copied straight from src/, which is exactly why
          # they need a check here: a file that is only referenced by an `exports` path cannot be
          # caught by the compiler, and a consumer's build fails with "cannot resolve" instead.
          for f in src/styles/index.css src/styles/tokens.css src/styles/base.css \
                   src/styles/tailwind.css; do
            test -f "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          # EVERY EXPORTED STYLE PATH MUST EXIST. Read them from package.json rather than repeating
          # the list: a fourth entry point added there and forgotten here is the failure this catches.
          node -e '
            const fs = require("node:fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const missing = Object.entries(pkg.exports)
              .filter(([k, v]) => typeof v === "string" && v.endsWith(".css"))
              .filter(([, v]) => !fs.existsSync(v))
              .map(([k, v]) => `${k} -> ${v}`)
            if (missing.length) {
              console.error("exports point at files that do not exist:\n" + missing.join("\n"))
              process.exit(1)
            }
            console.log("every exported stylesheet exists")
          '
          if ls dist/*.test.* >/dev/null 2>&1; then
            echo "::error::the build emitted test files into dist/"
            ls dist/*.test.*
            exit 1
          fi
          echo "build output is as declared"
